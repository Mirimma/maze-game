<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze Game</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #121212;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      
      .container {
        text-align: center;
      }
      
      h1 {
        color: #4CAF50;
        margin-bottom: 10px;
      }
      
      .game-wrapper {
        position: relative;
        width: 950px;
        height: 600px;
        margin: 20px auto;
        border: 3px solid #333;
        border-radius: 10px;
        overflow: hidden;
        background-color: #1a1a1a;
      }
      
      #phaser-game {
        width: 100%;
        height: 100%;
      }
      
      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 20px;
        color: #4CAF50;
      }
      
      .controls {
        margin-top: 15px;
        color: #888;
        font-size: 14px;
      }
      
      .key {
        display: inline-block;
        background-color: #333;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
        margin: 0 2px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Maze Game</h1>
      
      <div class="game-wrapper">
        <div id="phaser-game"></div>
        <div id="loading-text" class="loading">Loading game...</div>
      </div>
      
      <div class="controls">
        Controls: <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> or <span class="key">↑</span> <span class="key">←</span> <span class="key">↓</span> <span class="key">→</span>
      </div>
    </div>
    
    <script type="module">
      import './src/main.ts'
      
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loadingText = document.getElementById('loading-text')
          if (loadingText) {
            loadingText.style.display = 'none'
          }
        }, 1000)
      })
    </script>
  </body>
</html>
