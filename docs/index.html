<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Game - GitHub Pages</title>
    <style>
        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #fff;
            border-bottom: 2px solid #0f0;
            padding-bottom: 1rem;
        }
        .status {
            background: #111;
            padding: 2rem;
            margin: 2rem 0;
            border: 1px solid #0f0;
            border-radius: 5px;
        }
        .success {
            color: #0f0;
            font-size: 1.5em;
            margin: 1rem 0;
        }
        .links a {
            display: inline-block;
            margin: 0.5rem;
            padding: 0.5rem 1rem;
            background: #222;
            color: #0f0;
            text-decoration: none;
            border: 1px solid #0f0;
            border-radius: 3px;
        }
        .links a:hover {
            background: #0f0;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Maze Game</h1>
        <div class="status">
            <div class="success">✅ GitHub Pages Deployment</div>
            <p>If you can see this page, GitHub Pages is working!</p>
            <p>Deployment time: <span id="time"></span></p>
        </div>
        
        <div class="links">
            <a href="test.html">Test Page</a>
            <a href="https://github.com/Mirimma/maze-game">GitHub Repo</a>
            <a href="https://github.com/Mirimma/maze-game/actions">GitHub Actions</a>
        </div>
        
        <p>Project: Phaser.js + TypeScript + Vite</p>
        <p>Next: Game development implementation</p>
    </div>
    
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString();
        console.log('Maze Game GitHub Pages working!');
    </script>
</body>
</html>
